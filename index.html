<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar — Learn Malay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0F1B1A;
    --bg-soft:#16302C;
    --panel:#173330;
    --line: rgba(255,255,255,.10);
    --ink:#F3F1E7;
    --ink-dim: rgba(243,241,231,.62);
    --gold:#D9A441;
    --gold-soft:#EFC978;
    --coral:#E06C55;
    --teal:#3FA79A;
    --teal-deep:#1F5850;
    --good:#4EAE7C;
    --bad:#E0644F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Work Sans',sans-serif; }

  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(63,167,154,.18), transparent 65%),
      radial-gradient(ellipse 120% 80% at 50% 100%, rgba(217,164,65,.08), transparent 60%);
  }

  #app{ position:relative; z-index:1; max-width:560px; margin:0 auto; padding:28px 18px 60px; }

  header{ text-align:center; margin-bottom:22px; }
  .kicker{ font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-soft); margin-bottom:8px; }
  h1{
    font-family:'Fraunces',serif; font-weight:700; margin:0;
    font-size:clamp(1.8rem,7vw,2.5rem); line-height:1.1;
  }
  h1 span{ color:var(--gold-soft); }
  .subline{ color:var(--ink-dim); font-size:.92rem; margin-top:10px; max-width:40ch; margin-left:auto; margin-right:auto; }

  /* -------- category grid -------- */
  .stage{ display:none; }
  .stage.active{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; }
  .cat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px 14px; text-align:left; cursor:pointer; color:var(--ink);
    transition:transform .15s ease, border-color .15s ease; font-family:inherit;
  }
  .cat-card:hover, .cat-card:focus-visible{ transform:translateY(-2px); border-color:var(--gold); outline:none; }
  .cat-card .emoji{ font-size:1.5rem; display:block; margin-bottom:8px; }
  .cat-card .name{ font-weight:600; font-size:.98rem; }
  .cat-card .count{ color:var(--ink-dim); font-size:.78rem; margin-top:4px; }
  .cat-card .bar{ height:4px; border-radius:2px; background:rgba(255,255,255,.08); margin-top:10px; overflow:hidden; }
  .cat-card .bar-fill{ height:100%; background:var(--teal); border-radius:2px; }

  /* -------- flashcards -------- */
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; }
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:10px;
    padding:7px 12px; font-size:.82rem; cursor:pointer; font-family:inherit;
  }
  .back-btn:hover{ color:var(--ink); border-color:var(--gold); }
  .progress-label{ font-size:.8rem; color:var(--ink-dim); }
  .mode-toggle{ display:flex; gap:8px; margin-bottom:18px; }
  .mode-btn{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:transparent;
    color:var(--ink-dim); font-family:inherit; font-size:.85rem; cursor:pointer;
  }
  .mode-btn.on{ background:var(--teal-deep); border-color:var(--teal); color:var(--ink); }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 20px; cursor:pointer; user-select:none;
    position:relative;
  }
  .card .hint{ position:absolute; top:14px; right:16px; font-size:.7rem; color:var(--ink-dim); letter-spacing:.05em; }
  .card .word{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(1.6rem,7vw,2.2rem); }
  .card .word.malay{ color:var(--gold-soft); }
  .card .sub{ margin-top:10px; color:var(--ink-dim); font-size:.9rem; }

  .nav-row{ display:flex; gap:10px; margin-top:16px; }
  .nav-btn{
    flex:1; padding:13px; border-radius:12px; border:none; background:var(--teal);
    color:#08201C; font-weight:600; font-family:inherit; cursor:pointer; font-size:.92rem;
  }
  .nav-btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .nav-btn:active{ transform:scale(.98); }

  /* -------- quiz -------- */
  .quiz-q{ text-align:center; margin-bottom:20px; }
  .quiz-q .prompt-label{ font-size:.78rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.1em; }
  .quiz-q .prompt-word{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(1.7rem,7vw,2.3rem); color:var(--gold-soft); margin-top:6px; }
  .choices{ display:grid; gap:10px; }
  .choice{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px 16px;
    text-align:left; font-family:inherit; font-size:.96rem; color:var(--ink); cursor:pointer;
  }
  .choice.correct{ border-color:var(--good); background:rgba(78,174,124,.14); }
  .choice.wrong{ border-color:var(--bad); background:rgba(224,100,79,.14); }
  .choice[disabled]{ cursor:default; }

  .score-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:.85rem; color:var(--ink-dim); }
  .score-row strong{ color:var(--ink); }

  .quiz-done{ text-align:center; padding:30px 10px; }
  .quiz-done .big{ font-family:'Fraunces',serif; font-weight:700; font-size:2.2rem; color:var(--gold-soft); }

  footer{ text-align:center; margin-top:34px; color:var(--ink-dim); font-size:.75rem; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="kicker">Bahasa Malaysia</div>
    <h1>Belajar <span>Bahasa</span></h1>
    <p class="subline">Learn everyday Malay words and phrases with flashcards and quizzes.</p>
  </header>

  <!-- CATEGORY SELECT -->
  <section id="stage-categories" class="stage active">
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <!-- STUDY (flashcards / quiz) -->
  <section id="stage-study" class="stage">
    <div class="top-row">
      <button class="back-btn" id="backBtn">← Categories</button>
      <span class="progress-label" id="progressLabel"></span>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn" id="flashModeBtn">Flashcards</button>
      <button class="mode-btn" id="quizModeBtn">Quiz</button>
    </div>

    <div id="flashView">
      <div class="card" id="flashCard">
        <span class="hint">tap to flip</span>
        <div class="word malay" id="flashFront">—</div>
        <div class="sub" id="flashBack" style="display:none;"></div>
      </div>
      <div class="nav-row">
        <button class="nav-btn ghost" id="prevBtn">Prev</button>
        <button class="nav-btn" id="nextBtn">Next</button>
      </div>
    </div>

    <div id="quizView" style="display:none;">
      <div class="score-row">
        <span>Question <strong id="quizQNum">1</strong>/<span id="quizQTotal"></span></span>
        <span>Score: <strong id="quizScore">0</strong></span>
      </div>
      <div class="quiz-q">
        <div class="prompt-label" id="quizPromptLabel">What does this mean?</div>
        <div class="prompt-word" id="quizPromptWord">—</div>
      </div>
      <div class="choices" id="quizChoices"></div>
      <div class="quiz-done" id="quizDone" style="display:none;">
        <div class="prompt-label">Quiz complete</div>
        <div class="big" id="quizFinalScore"></div>
        <div class="nav-row" style="margin-top:20px;">
          <button class="nav-btn ghost" id="quizRetryBtn">Retry</button>
          <button class="nav-btn" id="quizBackBtn">Categories</button>
        </div>
      </div>
    </div>
  </section>

  <footer>Selamat belajar — happy learning</footer>
</div>

<script>
(function(){
  var VOCAB = {
    greetings: { name: "Greetings", emoji: "👋", words: [
      ["Selamat pagi", "Good morning"],
      ["Selamat petang", "Good afternoon"],
      ["Selamat malam", "Good night"],
      ["Apa khabar?", "How are you?"],
      ["Khabar baik", "I'm fine"],
      ["Terima kasih", "Thank you"],
      ["Sama-sama", "You're welcome"],
      ["Selamat tinggal", "Goodbye (to one staying)"],
      ["Jumpa lagi", "See you again"],
      ["Maaf", "Sorry / excuse me"]
    ]},
    numbers: { name: "Numbers", emoji: "🔢", words: [
      ["Satu", "One"], ["Dua", "Two"], ["Tiga", "Three"], ["Empat", "Four"],
      ["Lima", "Five"], ["Enam", "Six"], ["Tujuh", "Seven"], ["Lapan", "Eight"],
      ["Sembilan", "Nine"], ["Sepuluh", "Ten"]
    ]},
    family: { name: "Family", emoji: "👨‍👩‍👧", words: [
      ["Keluarga", "Family"], ["Ibu", "Mother"], ["Bapa", "Father"],
      ["Abang", "Older brother"], ["Kakak", "Older sister"], ["Adik", "Younger sibling"],
      ["Nenek", "Grandmother"], ["Datuk", "Grandfather"], ["Anak", "Child"], ["Suami/Isteri", "Husband/Wife"]
    ]},
    food: { name: "Food & Drink", emoji: "🍜", words: [
      ["Nasi", "Rice"], ["Air", "Water"], ["Ayam", "Chicken"], ["Ikan", "Fish"],
      ["Sayur", "Vegetable"], ["Buah", "Fruit"], ["Sedap", "Delicious"], ["Lapar", "Hungry"],
      ["Kenyang", "Full (satiated)"], ["Minum", "To drink"]
    ]},
    phrases: { name: "Everyday Phrases", emoji: "💬", words: [
      ["Saya tak faham", "I don't understand"], ["Tolong", "Please / help"],
      ["Berapa harga ini?", "How much is this?"], ["Di mana tandas?", "Where is the toilet?"],
      ["Saya nak...", "I want..."], ["Boleh tak?", "Is it okay? / Can I?"],
      ["Tak apa", "It's okay / never mind"], ["Jom!", "Let's go!"],
      ["Saya sesat", "I'm lost"], ["Bercakap Bahasa Inggeris?", "Do you speak English?"]
    ]},
    colors: { name: "Colors", emoji: "🎨", words: [
      ["Merah", "Red"], ["Biru", "Blue"], ["Kuning", "Yellow"], ["Hijau", "Green"],
      ["Hitam", "Black"], ["Putih", "White"], ["Oren", "Orange"], ["Ungu", "Purple"],
      ["Perang", "Brown"], ["Merah jambu", "Pink"]
    ]}
  };

  var STORAGE_KEY = "belajar-progress-v1";
  var progress = loadProgress();

  function loadProgress(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  function saveProgress(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e){}
  }
  function bestScore(catKey){
    var p = progress[catKey];
    return p && p.best ? p.best : 0;
  }

  var catGrid = document.getElementById("catGrid");
  Object.keys(VOCAB).forEach(function(key){
    var cat = VOCAB[key];
    var pct = Math.round((bestScore(key) / cat.words.length) * 100);
    var card = document.createElement("button");
    card.className = "cat-card";
    card.innerHTML =
      '<span class="emoji">' + cat.emoji + '</span>' +
      '<div class="name">' + cat.name + '</div>' +
      '<div class="count">' + cat.words.length + ' words' + (pct ? ' · best ' + pct + '%' : '') + '</div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
    card.addEventListener("click", function(){ openCategory(key); });
    catGrid.appendChild(card);
  });

  var stageCategories = document.getElementById("stage-categories");
  var stageStudy = document.getElementById("stage-study");
  var backBtn = document.getElementById("backBtn");
  var progressLabel = document.getElementById("progressLabel");
  var flashModeBtn = document.getElementById("flashModeBtn");
  var quizModeBtn = document.getElementById("quizModeBtn");
  var flashView = document.getElementById("flashView");
  var quizView = document.getElementById("quizView");

  var currentKey = null;
  var currentWords = [];
  var flashIndex = 0;
  var flashFlipped = false;

  function openCategory(key){
    currentKey = key;
    currentWords = VOCAB[key].words;
    progressLabel.textContent = VOCAB[key].name;
    stageCategories.classList.remove("active");
    stageStudy.classList.add("active");
    setMode("flash");
  }

  backBtn.addEventListener("click", function(){
    stageStudy.classList.remove("active");
    stageCategories.classList.add("active");
    refreshCategoryProgress();
  });

  function refreshCategoryProgress(){
    var cards = catGrid.querySelectorAll(".cat-card");
    Object.keys(VOCAB).forEach(function(key, i){
      var cat = VOCAB[key];
      var pct = Math.round((bestScore(key) / cat.words.length) * 100);
      var count = cards[i].querySelector(".count");
      var fill = cards[i].querySelector(".bar-fill");
      count.textContent = cat.words.length + " words" + (pct ? " · best " + pct + "%" : "");
      fill.style.width = pct + "%";
    });
  }

  function setMode(mode){
    flashModeBtn.classList.toggle("on", mode === "flash");
    quizModeBtn.classList.toggle("on", mode === "quiz");
    flashView.style.display = mode === "flash" ? "block" : "none";
    quizView.style.display = mode === "quiz" ? "block" : "none";
    if (mode === "flash") { flashIndex = 0; flashFlipped = false; renderFlash(); }
    if (mode === "quiz") { startQuiz(); }
  }
  flashModeBtn.addEventListener("click", function(){ setMode("flash"); });
  quizModeBtn.addEventListener("click", function(){ setMode("quiz"); });

  /* -------- flashcards -------- */
  var flashCard = document.getElementById("flashCard");
  var flashFront = document.getElementById("flashFront");
  var flashBack = document.getElementById("flashBack");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");

  function renderFlash(){
    var pair = currentWords[flashIndex];
    flashFlipped = false;
    flashFront.textContent = pair[0];
    flashFront.style.display = "block";
    flashBack.textContent = pair[1];
    flashBack.style.display = "none";
  }
  flashCard.addEventListener("click", function(){
    flashFlipped = !flashFlipped;
    var pair = currentWords[flashIndex];
    if (flashFlipped) {
      flashFront.textContent = pair[1];
      flashFront.classList.remove("malay");
    } else {
      flashFront.textContent = pair[0];
      flashFront.classList.add("malay");
    }
  });
  prevBtn.addEventListener("click", function(){
    flashIndex = (flashIndex - 1 + currentWords.length) % currentWords.length;
    renderFlash();
  });
  nextBtn.addEventListener("click", function(){
    flashIndex = (flashIndex + 1) % currentWords.length;
    renderFlash();
  });

  /* -------- quiz -------- */
  var quizQNum = document.getElementById("quizQNum");
  var quizQTotal = document.getElementById("quizQTotal");
  var quizScoreEl = document.getElementById("quizScore");
  var quizPromptWord = document.getElementById("quizPromptWord");
  var quizChoices = document.getElementById("quizChoices");
  var quizDone = document.getElementById("quizDone");
  var quizFinalScore = document.getElementById("quizFinalScore");
  var quizRetryBtn = document.getElementById("quizRetryBtn");
  var quizBackBtn = document.getElementById("quizBackBtn");
  var quizQuestionsWrap = document.querySelector(".quiz-q");
  var scoreRowEl = document.querySelector(".score-row");

  var quizOrder = [];
  var quizIndex = 0;
  var quizScore = 0;
  var quizAnswered = false;

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startQuiz(){
    quizOrder = shuffle(currentWords.map(function(_, i){ return i; }));
    quizIndex = 0;
    quizScore = 0;
    quizDone.style.display = "none";
    quizQuestionsWrap.style.display = "block";
    quizChoices.style.display = "grid";
    scoreRowEl.style.display = "flex";
    quizQTotal.textContent = quizOrder.length;
    renderQuizQuestion();
  }

  function renderQuizQuestion(){
    quizAnswered = false;
    quizQNum.textContent = quizIndex + 1;
    quizScoreEl.textContent = quizScore;
    var wordIdx = quizOrder[quizIndex];
    var pair = currentWords[wordIdx];
    quizPromptWord.textContent = pair[0];

    var correct = pair[1];
    var pool = currentWords.filter(function(_, i){ return i !== wordIdx; }).map(function(p){ return p[1]; });
    var wrongs = shuffle(pool).slice(0, Math.min(3, pool.length));
    var options = shuffle([correct].concat(wrongs));

    quizChoices.innerHTML = "";
    options.forEach(function(opt){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = opt;
      btn.addEventListener("click", function(){ handleAnswer(btn, opt, correct); });
      quizChoices.appendChild(btn);
    });
  }

  function handleAnswer(btn, chosen, correct){
    if (quizAnswered) return;
    quizAnswered = true;
    var allBtns = quizChoices.querySelectorAll(".choice");
    allBtns.forEach(function(b){
      b.disabled = true;
      if (b.textContent === correct) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
    });
    if (chosen === correct) {
      quizScore++;
      quizScoreEl.textContent = quizScore;
    }
    setTimeout(function(){
      quizIndex++;
      if (quizIndex < quizOrder.length) {
        renderQuizQuestion();
      } else {
        finishQuiz();
      }
    }, 700);
  }

  function finishQuiz(){
    quizQuestionsWrap.style.display = "none";
    quizChoices.style.display = "none";
    scoreRowEl.style.display = "none";
    quizDone.style.display = "block";
    quizFinalScore.textContent = quizScore + " / " + quizOrder.length;

    if (currentKey) {
      var prev = bestScore(currentKey);
      if (quizScore > prev) {
        progress[currentKey] = { best: quizScore };
        saveProgress();
      }
    }
  }

  quizRetryBtn.addEventListener("click", startQuiz);
  quizBackBtn.addEventListener("click", function(){
    stageStudy.classList.remove("active");
    stageCategories.classList.add("active");
    refreshCategoryProgress();
  });
})();
</script>
</body>
</html>
